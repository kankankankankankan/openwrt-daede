name: Validate upstream sync pull requests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Run Python regression tests
        run: |
          python3 -m unittest discover -s tests -p '*test.py' -v
      - name: Validate workflow and shell syntax
        run: |
          bash -n scripts/audit-upstream.sh
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              if 'name:' not in text or 'jobs:' not in text:
                  raise SystemExit(f'invalid workflow skeleton: {path}')
          PY

