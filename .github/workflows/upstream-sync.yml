name: Sync upstream core packages

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-core-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: kenzok8/openwrt-daede
  SYNC_PATHS: "dae daed vmlinux-btf"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream core
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin main
          git fetch --no-tags upstream main

          origin_sha=$(git rev-parse refs/remotes/origin/main)
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          echo "origin_sha=$origin_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          changed=false
          if ! git diff --quiet "$origin_sha" "$upstream_sha" -- $SYNC_PATHS; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Local main:    $origin_sha"
          echo "Upstream main: $upstream_sha"
          echo "Core changed:  $changed"

      - name: Apply upstream core paths
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Remove files deleted upstream, then restore only the upstream-owned
          # package directories. luci-app-daede and local CI files stay intact.
          deleted=$(git diff --name-only --diff-filter=D \
            "${{ steps.upstream.outputs.origin_sha }}" \
            "${{ steps.upstream.outputs.upstream_sha }}" -- $SYNC_PATHS || true)
          if [ -n "$deleted" ]; then
            printf '%s\n' "$deleted" | xargs -r git rm -f --
          fi
          git checkout "${{ steps.upstream.outputs.upstream_sha }}" -- $SYNC_PATHS

      - name: Validate the merged tree
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/*.test.cjs
          # These tests cover the sync workflow and package metadata without
          # starting the long-running member helper harness.
          python3 tests/workflow-gates-test.py
          python3 tests/package-info-test.py

      - name: Commit and push core update
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $SYNC_PATHS
          git commit -m "chore(sync): update core packages from upstream" \
            -m "Upstream ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}"

          # Rebase a concurrent main change before pushing. The synced paths are
          # isolated from the local LuCI overlay, so normal updates remain clean.
          git fetch --no-tags origin main
          git rebase refs/remotes/origin/main
          git push origin HEAD:main

      - name: Report unchanged
        if: steps.upstream.outputs.changed == 'false'
        run: echo "Upstream core packages are already current."
